    # ring 0.16.20 — unmaintained (same dependency chain as above)
    "RUSTSEC-2025-0010",

    # atty 0.2.14 — unmaintained (transitive: criterion -> zcash_proofs/zcash_primitives)
    "RUSTSEC-2024-0375",

    # atty 0.2.14 — unsound unaligned read (same dep chain)
    "RUSTSEC-2021-0145",

    # bincode 1.3.3 — unmaintained (transitive: uniffi_macros -> uniffi)
    "RUSTSEC-2025-0141",

    # paste 1.0.15 — unmaintained (transitive: uniffi_core, metal, accesskit_windows)
    "RUSTSEC-2024-0436",

    # rustls-pemfile 1.0.4 — unmaintained (transitive: reqwest 0.11)
    "RUSTSEC-2025-0134",

    # pprof 0.11.1 — unsound slice (transitive: zcash_proofs/zcash_primitives)
    "RUSTSEC-2024-0408",
