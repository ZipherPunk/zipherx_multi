name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check, Clippy & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: cargo fmt -- --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: >
          cargo clippy --no-deps
          -p zipherx-core -p zipherx-crypto -p zipherx-network
          -p zipherx-storage -p zipherx-ffi -p zipherx-tor -p zipherx-platform
          -- -D warnings
          -A clippy::manual_is_multiple_of
          -A clippy::useless_conversion
          -A clippy::needless_borrows_for_generic_args
          -A clippy::type_complexity
          -A clippy::drop_non_drop
          -A clippy::unnecessary_cast
          -A clippy::cloned_ref_to_slice_refs

      - name: Verify Cargo.lock is up-to-date
        run: cargo check --locked

      - name: cargo test (per-crate)
        run: |
          cargo test -p zipherx-platform
          cargo test -p zipherx-crypto
          cargo test -p zipherx-network
          cargo test -p zipherx-storage
          cargo test -p zipherx-core
          cargo test -p zipherx-ffi
          cargo test -p zipherx-tor

      - name: cargo audit
        run: |
          cargo install cargo-audit --locked || true
          cargo audit
